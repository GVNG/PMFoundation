#\n# macOS arm64\n#\n\nbuild_curl \\\n    \"macos-arm64\" \\\n    \"macosx\" \\\n    \"-arch arm64 -mmacosx-version-min=11.0\" \\\n    \"arm-apple-darwin\"\n\nbuild_curl \\\n    \"macos-x86_64\" \\\n    \"macosx\" \\\n    \"-arch x86_64 -mmacosx-version-min=11.0\" \\\n    \"x86_64-apple-darwin\"\n\necho \"curl builds complete\"\n";
