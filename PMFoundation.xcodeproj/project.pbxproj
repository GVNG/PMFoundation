			shellScript = "set -euo pipefail\n\nROOT=\"${SRCROOT}\"\nBUILD=\"${ROOT}/build\"\nSRC=\"${BUILD}/src\"\n\nOPENSSL_SRC=\"${SRC}/openssl\"\n\nDEPLOYMENT_TARGET=\"${IPHONEOS_DEPLOYMENT_TARGET:-17.8}\"\n\nmkdir -p \"$BUILD\"\n\nbuild_openssl() {\n\n    NAME=$1\n    SDK=$2\n    ARCHS=$3\n    CONFIGURE_TARGET=$4\n\n    PREFIX=\"${BUILD}/${NAME}\"\n\n    echo \"==============================\"\n    echo \"Building OpenSSL:\"\n    echo \"  NAME   = $NAME\"\n    echo \"  SDK    = $SDK\"\n    echo \"  ARCHS  = $ARCHS\"\n    echo \"  PREFIX = $PREFIX\"\n    echo \"==============================\"\n\n    SDK_PATH=\"$(xcrun --sdk \"$SDK\" --show-sdk-path)\"\n    CC=\"$(xcrun --sdk \"$SDK\" -f clang)\"\n\n    cd \"$OPENSSL_SRC\"\n\n    if [ -f Makefile ]; then\n        make clean\n    fi\n    \n    export CC\n    export CFLAGS=\"-isysroot ${SDK_PATH} ${ARCHS}\"\n    export LDFLAGS=\"-isysroot ${SDK_PATH} ${ARCHS}\"\n\n    ./Configure \"$CONFIGURE_TARGET\" \\\n        no-shared \\\n        no-dso \\\n        no-hw \\\n        no-engine \\\n        no-tests \\\n        no-apps \\\n        --prefix=\"$PREFIX\"\n\n    make -j$(sysctl -n hw.ncpu)\n\n    rm -rf \"$PREFIX\"\n\n    make install_sw\n}\n\n#\n# iOS device\n#\n\nbuild_openssl \\\n    \"iphoneos\" \\\n    \"iphoneos\" \\\n    \"-arch arm64 -miphoneos-version-min=${DEPLOYMENT_TARGET}\" \\\n    \"ios64-cross\"\n\n#\n# iOS simulator\n#\n\nbuild_openssl \\\n    \"iphonesimulator\" \\\n    \"iphonesimulator\" \\\n    \"-arch arm64 -arch x86_64 -mios-simulator-version-min=${DEPLOYMENT_TARGET}\" \\\n    \"iossimulator-xcrun\"\n\nbuild_openssl \\\n    \"macos-arm64\" \\\n    \"macosx\" \\\n    \"-arch arm64 -mmacosx-version-min=11.0\" \\\n    \"darwin64-arm64-cc\"\n\nbuild_openssl \\\n    \"macos-x86_64\" \\\n    \"macosx\" \\\n    \"-arch x86_64 -mmacosx-version-min=11.0\" \\\n    \"darwin64-x86_64-cc\"\n\necho \"OpenSSL builds complete\"\n";
		};
