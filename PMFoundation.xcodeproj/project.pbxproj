  -DWITH_IMGCODEC_SUNRASTER=OFF \\\n        -DWITH_PROTOBUF=OFF \\\n        -DWITH_OPENCL=OFF \\\n        -DWITH_OPENCL_SVM=OFF \\\n        -DWITH_OPENCL_D3D11_NV=OFF \\\n        -DWITH_VULKAN=OFF \\\n        -DWITH_METAL=OFF\n\n    cmake --build . --config Release -j$(sysctl -n hw.ncpu)\n\n    cmake --install .\n    rm -rf \"$BUILD_DIR\"\n    \n    cd \"$PREFIX/include\"\n\n    if [ -d \"opencv4\" ]; then\n        cp -R opencv4/opencv2 .\n        rm -rf opencv4\n    fi\n}\n\n#\n# iPhoneOS\n#\n\nbuild_opencv \\\n    \"iphoneos\" \\\n    \"iphoneos\" \\\n    \"arm64\" \\\n    \"$IOS_MIN\"\n\n#\n# iPhone Simulator\n#\n\nbuild_opencv \\\n    \"iphonesimulator\" \\\n    \"iphonesimulator\" \\\n    \"arm64;x86_64\" \\\n    \"$IOS_MIN\"\n\n#\n# macOS arm64\n#\n\nbuild_opencv \\\n    \"macos-arm64\" \\\n    \"macosx\" \\\n    \"arm64;x86_64\" \\\n    \"$MACOS_MIN\"\n\necho \"OpenCV build complete\"\n";
